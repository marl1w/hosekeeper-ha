log_fertilizing:
  fields:
    zone_id:
      required: true
      example: 01M1W927DYR1F5MWJYJW56E0PM
      selector:
        text:
    product:
      required: false
      default: slow_release
      selector:
        select:
          translation_key: fertilizer_product
          options:
            - bottos_pro_start
            - bottos_dark_green
            - bottos_summer_k
            - bottos_slow_green
            - bottos_slow_k
            - bottos_autumn_k
            - quick_release
            - slow_release
            - organic
            - liquid
            - iron
            - custom
    n:
      required: false
      selector:
        number:
          min: 0
          max: 50
          step: 0.5
          unit_of_measurement: "%"
    p:
      required: false
      selector:
        number:
          min: 0
          max: 50
          step: 0.5
          unit_of_measurement: "%"
    k:
      required: false
      selector:
        number:
          min: 0
          max: 50
          step: 0.5
          unit_of_measurement: "%"
    dose_g_m2:
      required: false
      selector:
        number:
          min: 1
          max: 200
          step: 1
          unit_of_measurement: "g/m²"
    notes:
      required: false
      selector:
        text:

log_sowing:
  fields:
    zone_id:
      required: true
      example: 01M1W927DYR1F5MWJYJW56E0PM
      selector:
        text:
    kind:
      required: false
      default: overseed
      selector:
        select:
          translation_key: sowing_kind
          options:
            - overseed
            - new_lawn
            - repair
    seed_mix:
      required: false
      selector:
        text:
    rate_g_m2:
      required: false
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "g/m²"
    notes:
      required: false
      selector:
        text:

log_maintenance:
  fields:
    zone_id:
      required: true
      example: 01M1W927DYR1F5MWJYJW56E0PM
      selector:
        text:
    kind:
      required: true
      selector:
        select:
          translation_key: maintenance_kind
          options:
            - mowing
            - fertilizing
            - sowing
            - weeding
            - aeration
            - scarifying
            - top_dressing
            - treatment
            - leaf_clearing
            - seedbed_watering
            - syringing
    height_mm:
      required: false
      selector:
        number:
          min: 10
          max: 120
          step: 5
          unit_of_measurement: mm
    product:
      required: false
      selector:
        text:
    notes:
      required: false
      selector:
        text:

log_issue:
  fields:
    zone_id:
      required: true
      example: 01M1W927DYR1F5MWJYJW56E0PM
      selector:
        text:
    issue:
      required: true
      selector:
        select:
          translation_key: issue
          options:
            - brown_patches
            - thin
            - weeds
            - moss
            - bare_spots
            - fungus
            - pests
            - thatch
    notes:
      required: false
      selector:
        text:

log_irrigation:
  fields:
    zone_id:
      required: true
      example: 01M1W927DYR1F5MWJYJW56E0PM
      selector:
        text:
    minutes:
      required: true
      selector:
        number:
          min: 1
          max: 600
          step: 1
          unit_of_measurement: min
    replace_today:
      selector:
        boolean:

set_status:
  fields:
    zone_id:
      required: true
      example: 01M1W927DYR1F5MWJYJW56E0PM
      selector:
        text:
    status:
      required: true
      selector:
        select:
          options:
            - excellent
            - good
            - fair
            - poor
          translation_key: lawn_status

import_weather:
  fields:
    zone_id:
      required: true
      example: 01M1W927DYR1F5MWJYJW56E0PM
      selector:
        text:
    date:
      required: true
      example: "2026-08-17"
      selector:
        date:
    tmax:
      required: true
      selector:
        number:
          min: -50
          max: 60
          step: 0.1
          unit_of_measurement: "°C"
    tmin:
      required: true
      selector:
        number:
          min: -50
          max: 60
          step: 0.1
          unit_of_measurement: "°C"
    rain_mm:
      required: false
      selector:
        number:
          min: 0
          max: 500
          step: 0.1
          unit_of_measurement: "mm"
    humidity_pct:
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
    wind_ms:
      required: false
      selector:
        number:
          min: 0
          max: 60
          step: 0.1
          unit_of_measurement: "m/s"
    solar_mj:
      required: false
      selector:
        number:
          min: 0
          max: 50
          step: 0.1
          unit_of_measurement: "MJ/m²"
